plugins { id 'com.android.application' }
android {
    namespace 'com.onesecondx.velocity'
    compileSdk 34
    defaultConfig {
        applicationId 'com.onesecondx.velocity'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '4.0.0'
        testInstrumentationRunner project.findProperty('verificationRunner') ?: 'com.onesecondx.velocity.V4Verification'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}

